<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redefinir senha • Busca Busca Imóveis</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
            background: linear-gradient(135deg, #ffcc1e 0%, #ffd700 100%);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .card {
            background: #fff;
            border-radius: 20px;
            padding: 32px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 16px;
        }

        h1 {
            font-size: 28px;
            margin: 0 0 8px;
            color: #00335e;
            font-weight: 700;
        }

        .subtitle {
            color: #64748b;
            margin: 0 0 32px;
            font-size: 16px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            font-size: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            outline: none;
            transition: all 0.2s ease;
            background: #f9fafb;
        }

        input:focus {
            border-color: #00335e;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(0, 51, 94, 0.1);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #00335e, #0ea5e9);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 51, 94, 0.3);
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .msg {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: 500;
        }

        .success {
            color: #059669;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
        }

        .error {
            color: #dc2626;
            background: #fef2f2;
            border: 1px solid #fecaca;
        }

        .actions {
            margin-top: 24px;
            display: flex;
            gap: 12px;
        }

        .link-btn {
            flex: 1;
            display: inline-block;
            text-align: center;
            padding: 12px 16px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            border: 2px solid #00335e;
            color: #00335e;
            background: #fff;
            transition: all 0.2s ease;
        }

        .link-btn:hover {
            background: #00335e;
            color: #fff;
        }

        .icon {
            margin-right: 8px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="logo">
                <img src="/logo_bb.jpg" alt="Busca Busca Imóveis" />
            </div>
            <h1>Redefinir senha</h1>
            <p class="subtitle">Defina sua nova senha para continuar usando o Busca Busca Imóveis.</p>

            <div class="form-group">
                <label for="pwd1">Nova senha</label>
                <input id="pwd1" type="password" placeholder="Digite sua nova senha" autocomplete="new-password" />
            </div>

            <div class="form-group">
                <label for="pwd2">Confirmar senha</label>
                <input id="pwd2" type="password" placeholder="Confirme sua nova senha" autocomplete="new-password" />
            </div>

            <button id="btn">🔒 Salvar nova senha</button>
            <div id="msg" class="msg"></div>

            <div class="actions">
                <a class="link-btn" href="buscabuscaimoveis://login">
                    📱 Retornar para o app
                </a>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

        // Carrega variáveis públicas do backend (injetadas por Vercel)
        await new Promise((resolve) => {
            const s = document.createElement('script');
            s.src = '/api/env.js';
            s.onload = resolve;
            s.onerror = resolve; // segue mesmo se falhar
            document.head.appendChild(s);
        });

        const supabaseUrl = window.ENV_SUPABASE_URL;
        const anonKey = window.ENV_SUPABASE_ANON_KEY;
        const supabase = createClient(supabaseUrl, anonKey);

        const btn = document.getElementById('btn');
        const pwd1 = document.getElementById('pwd1');
        const pwd2 = document.getElementById('pwd2');
        const msg = document.getElementById('msg');

        function setMsg(text, kind = 'error') {
            msg.className = 'msg ' + (kind === 'success' ? 'success' : 'error');
            msg.textContent = text;
        }

        // Lê fragmento: #access_token=...&type=recovery&refresh_token=...
        const params = new URLSearchParams(window.location.hash.slice(1));
        const type = params.get('type');
        const access_token = params.get('access_token');
        const refresh_token = params.get('refresh_token');

        async function ensureSession() {
            if (type !== 'recovery' || !access_token) {
                setMsg('Link inválido ou expirado. Solicite novamente.');
                btn.disabled = true;
                return;
            }
            const { error } = await supabase.auth.setSession({ access_token, refresh_token });
            if (error) {
                setMsg('Sessão inválida. Solicite um novo link.');
                btn.disabled = true;
            }
        }

        btn.addEventListener('click', async () => {
            const p1 = (pwd1.value || '').trim();
            const p2 = (pwd2.value || '').trim();
            if (p1.length < 6) return setMsg('A senha deve ter pelo menos 6 caracteres.');
            if (p1 !== p2) return setMsg('As senhas não coincidem.');
            btn.disabled = true;
            const { error } = await supabase.auth.updateUser({ password: p1 });
            btn.disabled = false;
            if (error) return setMsg(error.message || 'Erro ao atualizar a senha.');
            setMsg('✅ Senha alterada com sucesso!', 'success');
        });

        ensureSession();
    </script>
</body>

</html>
